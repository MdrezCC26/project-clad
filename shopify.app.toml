# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "b5567f6c8539fc6ddc010f225600712c"
name = "ProjectClad"
application_url = "https://project-clad.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/orders/paid"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_files,read_orders,read_products,read_themes,write_products,write_draft_orders,write_orders,write_merchant_managed_fulfillment_orders,write_app_proxy"

[auth]
redirect_urls = [ "https://project-clad.onrender.com/api/auth" ]

[app_proxy]
url = "https://project-clad.onrender.com"
subpath = "project-clad"
prefix = "apps"
